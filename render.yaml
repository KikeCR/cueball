services:
  - type: web
    name: cueball-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      npm install &&
      npm run build --workspace=packages/shared &&
      npm run build --workspace=apps/server &&
      npx prisma migrate deploy --schema apps/server/prisma/schema.prisma
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_AUTH_REDIRECT_URI
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ROOM_EXPIRY_HOURS
        value: "24"
      - key: ROOM_SWEEP_INTERVAL_MINUTES
        value: "30"
