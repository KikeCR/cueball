<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cast SDK isolation test</title>
</head>
<body style="font-family: sans-serif; padding: 2rem;">
  <h1>Cast SDK isolation test</h1>
  <p>No React, no Next.js — just the exact integration Google documents, served as a plain static page so it's fully isolated from anything CueBall's app code does.</p>
  <pre id="log" style="background:#eee; padding:1rem; white-space:pre-wrap;">waiting for __onGCastApiAvailable...</pre>
  <button id="castBtn" disabled>Connect to TV</button>

  <script>
    function log(msg) {
      document.getElementById('log').textContent += '\n' + msg
      console.log(msg)
    }

    window['__onGCastApiAvailable'] = function (isAvailable, reason) {
      log('__onGCastApiAvailable fired: isAvailable=' + isAvailable + ' reason=' + reason)
      log('typeof window.cast = ' + typeof window.cast)
      log('typeof window.chrome.cast = ' + (window.chrome ? typeof window.chrome.cast : 'window.chrome is undefined'))

      if (!isAvailable || !window.cast) {
        log('STOPPING: Cast API not available in this browser/profile.')
        return
      }

      cast.framework.CastContext.getInstance().setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
      })

      var btn = document.getElementById('castBtn')
      btn.disabled = false
      btn.onclick = function () {
        cast.framework.CastContext.getInstance().requestSession().then(
          function () { log('Connected!') },
          function (err) { log('requestSession error: ' + JSON.stringify(err)) },
        )
      }
    }
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js"></script>
</body>
</html>
